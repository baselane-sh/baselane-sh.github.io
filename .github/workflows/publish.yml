name: publish
# Builds the Baselane mods gallery from baselane-sh/mods-catalog at the org root
# (https://baselane-sh.github.io/), the same pages as https://baselane-sh.github.io/mods-catalog/.
# Canonical links point at the mods-catalog URL, so search engines see one copy.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  # The site build reads author content (READMEs), so it runs read-only, with no write token.
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: baselane-sh/mods-catalog
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: npm ci
      - run: node site/build.mjs
        env:
          SITE_BASE: /
          SITE_URL: https://baselane-sh.github.io/mods-catalog/
          GITHUB_TOKEN: ${{ github.token }}
      # A root build writes a CNAME for mods.baselane.sh; this copy has no custom domain.
      - run: rm -f _site/CNAME
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    needs: site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
